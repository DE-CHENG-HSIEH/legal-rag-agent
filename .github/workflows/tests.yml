name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-sft.txt
            requirements-eval.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-sft.txt -r requirements-eval.txt

      - name: Run Agent and data tests
        run: python -B -m unittest discover -s tests -v

      - name: Run SFT pipeline tests
        run: python -B -m unittest discover -s sft/tests -v

      - name: Validate LangSmith cases offline
        run: python evals/run_langsmith_evaluation.py --dry-run --split full
