<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img" aria-labelledby="title desc">
  <title id="title">相似判決 RAG 流程</title>
  <desc id="desc">公開判決的客觀摘要經 BGE-M3 建立 Chroma 索引。使用者查詢經 BGE-M3 轉成向量，召回 20 至 40 筆候選，以 BGE reranker 重排後取回 1 至 10 筆判決原文，分別交由 Agent 比較與 UI 顯示。</desc>
  <!-- Match architecture.svg: 1040px canvas, 20px labels, 220x64 nodes. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
    </marker>
    <style>
      .node { fill: #f6f8fa; stroke: #aeb8c3; stroke-width: 1.5; }
      .edge { fill: none; stroke: #6e7781; stroke-width: 1.5; marker-end: url(#arrow); }
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 20px; fill: #24292f; text-anchor: middle; }
    </style>
  </defs>
  <path fill="#fff" d="M0 0h1040v680H0z"/>
  <g class="edge">
    <path d="M260 88V136"/>
    <path d="M780 88V136"/>
    <path d="M260 200V248"/>
    <path d="M780 200V248"/>
    <path d="M670 280H370"/>
    <path d="M260 312V336H520V360"/>
    <path d="M520 424V472"/>
    <path d="M520 536V560H260V584"/>
    <path d="M520 536V560H780V584"/>
  </g>
  <g class="node">
    <rect x="150" y="24" width="220" height="64" rx="6"/>
    <rect x="670" y="24" width="220" height="64" rx="6"/>
    <rect x="150" y="136" width="220" height="64" rx="6"/>
    <rect x="670" y="136" width="220" height="64" rx="6"/>
    <rect x="150" y="248" width="220" height="64" rx="6"/>
    <rect x="670" y="248" width="220" height="64" rx="6"/>
    <rect x="410" y="360" width="220" height="64" rx="6"/>
    <rect x="410" y="472" width="220" height="64" rx="6"/>
    <rect x="150" y="584" width="220" height="64" rx="6"/>
    <rect x="670" y="584" width="220" height="64" rx="6"/>
  </g>
  <text x="260" y="64">案件事實與量刑因素</text>
  <text x="780" y="50">2,154 筆公開判決<tspan x="780" dy="26">JSONL 客觀摘要</tspan></text>
  <text x="260" y="162">BAAI/bge-m3<tspan x="260" dy="26">查詢向量</tspan></text>
  <text x="780" y="162">BAAI/bge-m3<tspan x="780" dy="26">摘要向量</tspan></text>
  <text x="260" y="274">向量召回候選<tspan x="260" dy="26">Top 20 至 40</tspan></text>
  <text x="780" y="288">本機 Chroma</text>
  <text x="520" y="386">BGE reranker 重排<tspan x="520" dy="26">bge-reranker-v2-m3</tspan></text>
  <text x="520" y="498">取回 Top 1 至 10 筆<tspan x="520" dy="26">犯罪事實、量刑及主文</tspan></text>
  <text x="260" y="624">Agent 比較與整理</text>
  <text x="780" y="624">UI 直接渲染原文</text>
</svg>
